<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hors connexion</title>
        <link rel="icon" type="image/png" href="/icons/favicon-32.png">
        <link rel="stylesheet" href="/plugins/fontawesome/css/all.min.css">
        <link rel="stylesheet" href="/fonts/source-sans-pro.css">
        <link rel="stylesheet" href="/dist/css/adminlte.min.css">
    </head>
    <body class="hold-transition">
        <div class="d-flex flex-column align-items-center justify-content-center text-center p-4" style="min-height: 100vh; background: #f4f6f9;">
            <img src="/icons/icon-192.png" alt="" width="96" height="96" class="img-circle elevation-2 mb-4">
            <h1 class="h3 text-dark"><i class="fas fa-wifi text-muted" aria-hidden="true"></i> Pas de connexion</h1>
            <p class="text-muted">Impossible de joindre le serveur. Vérifiez votre connexion internet puis réessayez.</p>
            <button type="button" class="btn btn-primary" onclick="location.reload()">
                <i class="fas fa-redo" aria-hidden="true"></i> Réessayer
            </button>
        </div>
    </body>
</html>
