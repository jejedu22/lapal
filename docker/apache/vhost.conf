<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Le .htaccess fourni par symfony/apache-pack gère la réécriture vers index.php
        AllowOverride All
        Require all granted
    </Directory>

    # Pas besoin d'exposer la version d'Apache derrière Traefik
    ServerSignature Off

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

