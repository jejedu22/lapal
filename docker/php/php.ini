date.timezone = Europe/Paris
expose_php = Off
memory_limit = 256M

; upload du logo (SettingsController)
upload_max_filesize = 8M
post_max_size = 10M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Durcissement (avis PHP GHSA-6wmf-4rv5-p3rp / GHSA-w8hw-w9fx-j79w, oct. 2026)
; L'application n'utilise pas le suivi de progression des envois de fichiers
session.upload_progress.enabled = 0
; Un seul fichier envoyé (logo) ; formulaires peu imbriqués (quantites[id], formulaires Symfony)
max_file_uploads = 2
max_input_nesting_level = 16
